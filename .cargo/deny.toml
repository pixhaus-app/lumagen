# cargo-deny configuration for lumagen. License allowlist covers the permissive licenses
# actually present in the dependency tree (verified via `cargo deny list`); all are
# OSI-approved and compatible with the skills' licensing guidance for these crates.

[licenses]
# Permissive licenses found in the tree. `MIT OR Apache-2.0` dual-licensing is the common
# case (egui/eframe/wgpu/keyring/serde/tokio family).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # webpki-root-certs (via rustls-platform-verifier ← reqwest): permissive root-cert bundle.
    "CDLA-Permissive-2.0",
]
# Confidence threshold for license-expression detection.
confidence-threshold = 0.8

[advisories]
# Warn (don't hard-fail the session) on unmaintained/vulnerability advisories pulled from
# the advisory DB; a yanked crate still fails.
yanked = "deny"
# `paste` is unmaintained but a benign, ubiquitous proc-macro pulled in transitively (via
# wgpu/egui). No drop-in replacement exists that those deps use; accept the advisory rather
# than fail the build on a crate we can't swap out.
ignore = [
    "RUSTSEC-2024-0436",
]

[bans]
# Surface duplicate versions rather than failing outright (the wgpu tree legitimately
# carries more than one windows-*/objc2 generation during transitions).
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Crates come from crates.io only; no git/registry overrides are permitted.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
